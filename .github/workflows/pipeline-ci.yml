name: Pipeline CI

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline-ci.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel && pip install -e ".[dev]"

      - name: Console scripts installed
        run: parking-run --help

      - name: Ruff
        run: ruff check src tests scripts

      - name: Pytest
        run: pytest

      - name: Parse cohort regression (sample)
        run: |
          python scripts/regression_parse_cohort.py \
            --input data/samples/clean_parking_targets.csv \
            --expect-min-parsed 10
